name: Deploy devotions to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate site
        run: node tools/validate-site.cjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published styles and scripts
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for asset in base.css discover.css community.css theme.js site.js community.js firebase-config.js; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 "${PAGE_URL}assets/${asset}?deployment=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o /dev/null
          done
